---
name: Build Docker Image

on:
  workflow_dispatch:
    inputs:
      registry:
        required: false
        default: ghcr.io
        type: string
      package:
        required: true
        type: string
  workflow_call:
    inputs:
      registry:
        required: false
        default: ghcr.io
        type: string
      package:
        required: true
        type: string
jobs:
  build:
    name: Build and Push docker container
    runs-on: ubuntu-latest

    # Required to write to ghcr.io
    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest ${{ inputs.package }} tag
        id: get-tag
        run: |
          PACKAGE="${{ inputs.package }}"
          LATEST_TAG=$(git tag --list "@tributary-so/${PACKAGE}-*" --sort=-version:refname | head -1)
          if [ -z "$LATEST_TAG" ]; then
            echo "::error::No ${PACKAGE} tag found"
            exit 1
          fi
          VERSION=${LATEST_TAG#@tributary-so/${PACKAGE}-}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "::notice::Using ${PACKAGE} version: $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: "Login to GitHub Container Registry"
        uses: docker/login-action@v2.2.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push docker image
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: ${{ inputs.registry }}/tributary-so/${{ inputs.package }}:${{ steps.get-tag.outputs.version }}
          file: ${{ inputs.package }}/Dockerfile
          context: .
          build-args: |
            VCS_REF=${{ github.sha }}
            IMAGE_VERSION=${{ steps.get-tag.outputs.version }}
