name: SDK Publish

on:
  push:
    branches: [main]
    paths:
      - "sdk/**"
      - ".github/workflows/publish-sdk.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run semantic-release in dry-run mode (no actual publish)
        required: false
        default: false
        type: boolean

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./sdk

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm run lint

      - name: Run tests
        run: cd tests && npx jest

  build:
    name: Build
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./sdk

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK package
        run: pnpm run build

      - name: Verify build output
        run: |
          if [ ! -f "dist/sdk/src/index.js" ]; then
            echo "Error: Build output not found at dist/sdk/src/index.js"
            exit 1
          fi
          if [ ! -f "dist/sdk/src/index.d.ts" ]; then
            echo "Error: Type definitions not found at dist/sdk/src/index.d.ts"
            exit 1
          fi

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name != 'workflow_dispatch'
    permissions:
      contents: write
      id-token: write
      packages: write

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK package
        run: pnpm run build

      - name: Configure Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install and run semantic-release
        working-directory: ./sdk
        run: |
          pnpm install --save-dev semantic-release @semantic-release/git @semantic-release/release-notes-generator @semantic-release/commit-analyzer @semantic-release/npm @semantic-release/github
          npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dry-run:
    name: Dry Run (Preview)
    needs: build
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/main' || github.event.inputs.dry_run == 'true'
    permissions:
      contents: read

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK package
        run: pnpm run build

      - name: Install semantic-release in dry-run mode
        working-directory: ./sdk
        run: |
          pnpm install --save-dev semantic-release @semantic-release/release-notes-generator @semantic-release/commit-analyzer
          npx semantic-release --dry-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on PR with version preview
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
              per_page: 100
            });
            const botComment = comments.find(c =>
              c.user.type === "Bot" && c.body.includes("SDK Release Preview")
            );
            const body = "## SDK Release Preview\n\nThis is a dry-run preview. No actual release has been published.";
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr,
                body: body
              });
            }
