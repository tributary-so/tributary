name: Mono-repo Release

on:
  push:
    branches:
      - main
  workflow_call:
    inputs:
      dry_run:
        description: Run semantic-release in dry-run mode (no actual publish)
        required: false
        default: false
        type: boolean
      skip_tests:
        description: Skip tests (for testing purposes only)
        required: false
        default: false
        type: boolean
      post_release:
        description: Run all post-release jobs (app, landing, docs, docker images) without running release
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run semantic-release in dry-run mode (no actual publish)
        required: false
        default: false
        type: boolean
      skip_tests:
        description: Skip tests (for testing purposes only)
        required: false
        default: false
        type: boolean
      post_release:
        description: Run all post-release jobs (app, landing, docs, docker images) without running release
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  detect-changes:
    name: Detect Changed Packages
    runs-on: ubuntu-latest
    outputs:
      has_programs: ${{ steps.detect.outputs.has_programs }}
      has_payments: ${{ steps.detect.outputs.has_payments }}
      has_sdk: ${{ steps.detect.outputs.has_sdk }}
      has_sdk_react: ${{ steps.detect.outputs.has_sdk_react }}
      has_sdk_x402: ${{ steps.detect.outputs.has_sdk_x402 }}
      has_scheduler: ${{ steps.detect.outputs.has_scheduler }}
      has_checkout: ${{ steps.detect.outputs.has_checkout }}
      has_lando: ${{ steps.detect.outputs.has_lando }}
      has_lando_backend: ${{ steps.detect.outputs.has_lando_backend }}
      has_app: ${{ steps.detect.outputs.has_app }}
      has_api: ${{ steps.detect.outputs.has_api }}
      sdk_paths: ${{ steps.detect.outputs.sdk_paths }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed packages
        id: detect
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || git rev-list --max-parents=0 HEAD)
          echo "Diffing against: $PREV_TAG"
          echo ""

          CHANGED_FILES=$(git diff --name-only "$PREV_TAG")
          echo "Changed files:"
          echo "$CHANGED_FILES"
          echo ""

          HAS_PROGRAMS=0
          HAS_SDK=0
          HAS_SDK_REACT=0
          HAS_SDK_X402=0
          HAS_PAYMENTS=0
          HAS_SCHEDULER=0
          HAS_CHECKOUT=0
          HAS_APP=0
          HAS_API=0
          HAS_LANDO=0
          HAS_LANDO_BACKEND=0
          HAS_CLI=0

          if echo "$CHANGED_FILES" | grep -q "^programs/"; then
            HAS_PROGRAMS=1
            echo "::notice::Programs changed"
          fi
          if echo "$CHANGED_FILES" | grep -q "^packages/sdk/"; then
            HAS_SDK=1
            echo "::notice::SDK changed"
          fi
          if echo "$CHANGED_FILES" | grep -q "^packages/payments/"; then
            HAS_PAYMENTS=1
            echo "::notice::Payments changed"
          fi
          if echo "$CHANGED_FILES" | grep -q "^packages/sdk-react/"; then
            HAS_SDK_REACT=1
            echo "::notice::SDK-React changed"
          fi
          if echo "$CHANGED_FILES" | grep -q "^packages/sdk-x402/"; then
            HAS_SDK_X402=1
            echo "::notice::SDK-x402 changed"
          fi
          if echo "$CHANGED_FILES" | grep -q "^apps/scheduler/"; then
            HAS_SCHEDULER=1
            echo "::notice::Scheduler changed"
          fi
          if echo "$CHANGED_FILES" | grep -q "^apps/checkout/"; then
            HAS_CHECKOUT=1
            echo "::notice::Checkout app changed"
          fi
          if echo "$CHANGED_FILES" | grep -q "^apps/app/"; then
            HAS_APP=1
            echo "::notice::app changed"
          fi
          if echo "$CHANGED_FILES" | grep -q "^apps/api/"; then
            HAS_API=1
            echo "::notice::app changed"
          fi
          if echo "$CHANGED_FILES" | grep -q "^apps/lando/"; then
            HAS_LANDO=1
            echo "::notice::lando changed"
          fi
          if echo "$CHANGED_FILES" | grep -q "^apps/lando-backend/"; then
            HAS_LANDO_BACKEND=1
            echo "::notice::lando-backend changed"
          fi
          if echo "$CHANGED_FILES" | grep -q "^apps/cli/"; then
            HAS_CLI=1
            echo "::notice::lando-backend changed"
          fi

          if [ "${{ github.event.inputs.post_release }}" == "true" ]; then
            HAS_PROGRAMS=1
            HAS_PAYMENTS=1
            HAS_SCHEDULER=1
            HAS_CHECKOUT=1
            HAS_APP=1
            HAS_API=1
            HAS_LANDO=1
            HAS_LANDO_BACKEND=1
            HAS_CLI=1
          fi

          echo "has_programs=$HAS_PROGRAMS" >> "$GITHUB_OUTPUT"
          echo "has_payments=$HAS_PAYMENTS" >> "$GITHUB_OUTPUT"
          echo "has_sdk=$HAS_SDK" >> "$GITHUB_OUTPUT"
          echo "has_sdk_react=$HAS_SDK_REACT" >> "$GITHUB_OUTPUT"
          echo "has_sdk_x402=$HAS_SDK_X402" >> "$GITHUB_OUTPUT"
          echo "has_scheduler=$HAS_SCHEDULER" >> "$GITHUB_OUTPUT"
          echo "has_checkout=$HAS_CHECKOUT" >> "$GITHUB_OUTPUT"
          echo "has_lando=$HAS_LANDO" >> "$GITHUB_OUTPUT"
          echo "has_lando_backend=$HAS_LANDO_BACKEND" >> "$GITHUB_OUTPUT"
          echo "has_app=$HAS_APP" >> "$GITHUB_OUTPUT"
          echo "has_api=$HAS_API" >> "$GITHUB_OUTPUT"
          echo "has_cli=$HAS_CLI" >> "$GITHUB_OUTPUT"

          # we always test SDK no matter
          ELEMENTS="\"packages/sdk\","
          # if [ "$HAS_SDK" = "1" ]; then
          #   ELEMENTS="${ELEMENTS}\"packages/sdk\","
          # fi
          if [ "$HAS_SDK_REACT" = "1" ]; then
            ELEMENTS="${ELEMENTS}\"packages/sdk-react\","
          fi
          if [ "$HAS_SDK_X402" = "1" ]; then
            ELEMENTS="${ELEMENTS}\"packages/sdk-x402\","
          fi
          if [ "$HAS_PAYMENTS" = "1" ]; then
            ELEMENTS="${ELEMENTS}\"packages/payments\","
          fi

          if [ -n "$ELEMENTS" ]; then
            ELEMENTS=${ELEMENTS%,}
            PATHS="[$ELEMENTS]"
          else
            PATHS="[]"
          fi
          echo "sdk_paths=$PATHS" >> "$GITHUB_OUTPUT"

          echo "::notice::Paths: $PATHS"

  test-programs:
    name: Test Programs
    needs: detect-changes
    if: needs.detect-changes.outputs.has_programs == '1' && github.event.inputs.skip_tests != 'true'
    uses: ./.github/workflows/program-tests.yml

  test-sdks:
    name: Test SDKs
    needs: detect-changes
    uses: ./.github/workflows/sdk-tests.yml
    with:
      paths: ${{ needs.detect-changes.outputs.sdk_paths }}

  release:
    name: Release
    needs: [test-sdks]
    if: github.event.inputs.post_release != 'true'
    secrets: inherit
    uses: ./.github/workflows/semantic-release.yml
    with:
      dry_run: ${{ github.event.inputs.dry_run || false }}

  release-pass:
    name: Release Pass-through
    needs: [detect-changes, test-sdks]
    if: github.event.inputs.post_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Pass
        run: 'echo "Post-release mode: skipping release"'

  app:
    name: Update App
    needs: [release-pass, detect-changes]
    if: needs.detect-changes.outputs.has_app == '1' || github.event.inputs.post_release == 'true'
    secrets: inherit
    uses: ./.github/workflows/app-prod.yaml

  landingpage:
    name: Update Landing Page
    needs: [release-pass]
    if: github.event.inputs.post_release == 'true'
    secrets: inherit
    uses: ./.github/workflows/landing-page.yaml

  docs:
    name: Update Docs
    needs: [release-pass]
    if: github.event.inputs.post_release == 'true'
    secrets: inherit
    uses: ./.github/workflows/docs.yaml

  docs-sdk:
    name: Update SDK Docs
    needs: [release-pass, detect-changes]
    if: needs.detect-changes.outputs.has_sdk == '1' || github.event.inputs.post_release == 'true'
    secrets: inherit
    uses: ./.github/workflows/sdk-typedocs.yaml

  build-scheduler-docker:
    name: Build Scheduler Docker Image
    needs: [release-pass, detect-changes]
    if: needs.detect-changes.outputs.has_scheduler == '1' || github.event.inputs.post_release == 'true'
    permissions:
      packages: write
      contents: read
    uses: ./.github/workflows/build-docker-image.yaml
    with:
      registry: ghcr.io
      package: apps/scheduler

  build-api-docker:
    name: Build API Docker Image
    needs: [release-pass, detect-changes]
    if: needs.detect-changes.outputs.has_api == '1' || github.event.inputs.post_release == 'true'
    permissions:
      packages: write
      contents: read
    uses: ./.github/workflows/build-docker-image.yaml
    with:
      registry: ghcr.io
      package: apps/api

  build-lando-backend-docker:
    name: Build Scheduler Docker Image
    needs: [release-pass, detect-changes]
    if: needs.detect-changes.outputs.has_lando_backend == '1' || github.event.inputs.post_release == 'true'
    permissions:
      packages: write
      contents: read
    uses: ./.github/workflows/build-docker-image.yaml
    with:
      registry: ghcr.io
      package: apps/lando-backend

  checkoutpage:
    name: Update Checkout App
    needs: [release-pass, detect-changes]
    if: needs.detect-changes.outputs.has_checkout == '1' || github.event.inputs.post_release == 'true'
    secrets: inherit
    uses: ./.github/workflows/checkout-page.yaml

  lando:
    name: Update lando App
    needs: [release-pass, detect-changes]
    if: needs.detect-changes.outputs.has_lando == '1' || github.event.inputs.post_release == 'true'
    secrets: inherit
    uses: ./.github/workflows/lando-page.yaml
