name: Mono-repo Release

on:
  push:
    branches:
      - main
      - beta
  workflow_call:
    inputs:
      dry_run:
        description: Run semantic-release in dry-run mode (no actual publish)
        required: false
        default: false
        type: boolean
      skip_tests:
        description: Skip tests (for testing purposes only)
        required: false
        default: false
        type: boolean
      post_release:
        description: Run all post-release jobs (app, landing, docs, docker images) without running release
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run semantic-release in dry-run mode (no actual publish)
        required: false
        default: false
        type: boolean
      skip_tests:
        description: Skip tests (for testing purposes only)
        required: false
        default: false
        type: boolean
      post_release:
        description: Run all post-release jobs (app, landing, docs, docker images) without running release
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  detect-changes:
    name: Detect Changed Packages
    runs-on: ubuntu-latest
    outputs:
      build_programs: ${{ steps.detect.outputs.build_programs }}
      build_sdk: ${{ steps.detect.outputs.build_sdk }}
      build_scheduler: ${{ steps.detect.outputs.build_scheduler }}
      build_checkout: ${{ steps.detect.outputs.build_checkout }}
      build_lando: ${{ steps.detect.outputs.build_lando }}
      build_app: ${{ steps.detect.outputs.build_app }}
      build_api: ${{ steps.detect.outputs.build_api }}
      sdk_paths: ${{ steps.detect.outputs.sdk_paths }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed packages
        id: detect
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || git rev-list --max-parents=0 HEAD)
          echo "Diffing against: $PREV_TAG"
          echo ""

          CHANGED_FILES=$(git diff --name-only "$PREV_TAG")
          echo "Changed files:"
          echo "$CHANGED_FILES"
          echo ""

          BUILD_PROGRAMS=0
          BUILD_SDK=0
          BUILD_SCHEDULER=0
          BUILD_CHECKOUT=0
          BUILD_APP=0
          BUILD_API=0
          BUILD_FORWARD_BUILDER=0
          BUILD_LANDO=0
          BUILD_CLI=0

          ELEMENTS="\"packages/sdk\","

          ## Contract
          if echo "$CHANGED_FILES" | grep -q "^programs/"; then
            BUILD_PROGRAMS=1
            echo "::notice::Programs changed"
          fi

          ## Packages
          if echo "$CHANGED_FILES" | grep -q "^packages/sdk/"; then
            BUILD_SDK=1
            # require rebuild when sdk changes!
            BUILD_API=1
            BUILD_FORWARD_BUILDER=1
            BUILD_APP=1
            BUILD_CHECKOUT=1
            BUILD_CLI=1
            BUILD_SCHEDULER=1
            echo "::notice::SDK changed"
          fi
          if echo "$CHANGED_FILES" | grep -q "^packages/payments/"; then
            ELEMENTS="${ELEMENTS}\"packages/payments\","
            BUILD_CHECKOUT=1
            echo "::notice::Payments changed"
          fi
          if echo "$CHANGED_FILES" | grep -q "^packages/sdk-react/"; then
            ELEMENTS="${ELEMENTS}\"packages/sdk-react\","
            echo "::notice::SDK-React changed"
          fi
          if echo "$CHANGED_FILES" | grep -q "^packages/sdk-x402/"; then
            ELEMENTS="${ELEMENTS}\"packages/sdk-x402\","
            echo "::notice::SDK-x402 changed"
          fi
          if echo "$CHANGED_FILES" | grep -q "^packages/forward-builders/"; then
            BUILD_FORWARD_BUILDER=1
            BUILD_SCHEDULER=1
            echo "::notice::api changed"
          fi
          if echo "$CHANGED_FILES" | grep -q "^packages/tokens-client/"; then
            BUILD_API=1
            echo "::notice::tokens-client changed"
          fi
          if echo "$CHANGED_FILES" | grep -q "^packages/pools-client/"; then
            BUILD_API=1
            echo "::notice::pools-client changed"
          fi

          ## Apps
          if echo "$CHANGED_FILES" | grep -q "^apps/lando/"; then
            BUILD_LANDO=1
            echo "::notice::lando changed"
          fi
          if echo "$CHANGED_FILES" | grep -q "^apps/cli/"; then
            BUILD_CLI=1
            echo "::notice::cli changed"
          fi
          if echo "$CHANGED_FILES" | grep -q "^apps/scheduler/"; then
            BUILD_SCHEDULER=1
            echo "::notice::Scheduler changed"
          fi
          if echo "$CHANGED_FILES" | grep -q "^apps/checkout/"; then
            BUILD_CHECKOUT=1
            echo "::notice::Checkout app changed"
          fi
          if echo "$CHANGED_FILES" | grep -q "^apps/app/"; then
            BUILD_APP=1
            echo "::notice::app changed"
          fi
          if echo "$CHANGED_FILES" | grep -q "^apps/api/"; then
            BUILD_API=1
            echo "::notice::api changed"
          fi

          if [ "${{ github.event.inputs.post_release }}" == "true" ]; then
            BUILD_PROGRAMS=1
            BUILD_SCHEDULER=1
            BUILD_CHECKOUT=1
            BUILD_APP=1
            BUILD_API=1
            BUILD_FORWARD_BUILDER=1
            BUILD_LANDO=1
            BUILD_CLI=1
          fi

          echo "build_programs=$BUILD_PROGRAMS" >> "$GITHUB_OUTPUT"
          echo "build_sdk=$BUILD_SDK" >> "$GITHUB_OUTPUT"
          echo "build_scheduler=$BUILD_SCHEDULER" >> "$GITHUB_OUTPUT"
          echo "build_checkout=$BUILD_CHECKOUT" >> "$GITHUB_OUTPUT"
          echo "build_lando=$BUILD_LANDO" >> "$GITHUB_OUTPUT"
          echo "build_app=$BUILD_APP" >> "$GITHUB_OUTPUT"
          echo "build_api=$BUILD_API" >> "$GITHUB_OUTPUT"
          echo "build_cli=$BUILD_CLI" >> "$GITHUB_OUTPUT"


          if [ -n "$ELEMENTS" ]; then
            ELEMENTS=${ELEMENTS%,}
            PATHS="[$ELEMENTS]"
          else
            PATHS="[]"
          fi
          echo "sdk_paths=$PATHS" >> "$GITHUB_OUTPUT"

          echo "::notice::Paths: $PATHS"

  test-programs:
    name: Test Programs
    needs: detect-changes
    # && false results in skipping this test
    if: needs.detect-changes.outputs.build_programs == '1' && github.event.inputs.skip_tests != 'true' && false
    uses: ./.github/workflows/program-tests.yml

  test-sdks:
    name: Test SDKs
    needs: detect-changes
    uses: ./.github/workflows/sdk-tests.yml
    with:
      paths: ${{ needs.detect-changes.outputs.sdk_paths }}

  release:
    name: Release
    needs: [test-sdks]
    if: github.event.inputs.post_release != 'true'
    secrets: inherit
    uses: ./.github/workflows/semantic-release.yml
    with:
      dry_run: ${{ github.event.inputs.dry_run || false }}

  app:
    name: Update App
    needs: [release, detect-changes]
    if: always() && (needs.detect-changes.outputs.build_app == '1' || github.event.inputs.post_release == 'true')
    secrets: inherit
    uses: ./.github/workflows/app-prod.yaml

  landingpage:
    name: Update Landing Page
    needs: [release]
    if: always()
    secrets: inherit
    uses: ./.github/workflows/landing-page.yaml

  docs:
    name: Update Docs
    needs: [release]
    if: always()
    secrets: inherit
    uses: ./.github/workflows/docs.yaml

  docs-sdk:
    name: Update SDK Docs
    needs: [release, detect-changes]
    if: always() && (needs.detect-changes.outputs.build_sdk == '1' || github.event.inputs.post_release == 'true')
    secrets: inherit
    uses: ./.github/workflows/sdk-typedocs.yaml

  build-scheduler-docker:
    name: Build Scheduler Docker Image
    needs: [release, detect-changes]
    if: always() && (needs.detect-changes.outputs.build_scheduler == '1' || github.event.inputs.post_release == 'true')
    permissions:
      packages: write
      contents: read
    uses: ./.github/workflows/build-docker-image.yaml
    with:
      registry: ghcr.io
      package: apps/scheduler

  build-api-docker:
    name: Build API Docker Image
    needs: [release, detect-changes]
    if: always() && (needs.detect-changes.outputs.build_api == '1' || github.event.inputs.post_release == 'true')
    permissions:
      packages: write
      contents: read
    uses: ./.github/workflows/build-docker-image.yaml
    with:
      registry: ghcr.io
      package: apps/api

  checkoutpage:
    name: Update Checkout App
    needs: [release, detect-changes]
    if: always() && (needs.detect-changes.outputs.build_checkout == '1' || github.event.inputs.post_release == 'true')
    secrets: inherit
    uses: ./.github/workflows/checkout-page.yaml

  lando:
    name: Update lando App
    needs: [release, detect-changes]
    if: always() && (needs.detect-changes.outputs.build_lando == '1' || github.event.inputs.post_release == 'true')
    secrets: inherit
    uses: ./.github/workflows/lando-page.yaml
