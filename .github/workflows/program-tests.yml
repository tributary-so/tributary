name: Program Tests

on:
  workflow_call:
    inputs:
      solana_version:
        type: string
        required: false
        default: ""
      anchor_version:
        type: string
        required: false
        default: ""

jobs:
  test:
    name: Anchor Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: |
          pnpm install
          corepack enable

      - name: Build SDK
        working-directory: ./packages/sdk
        run: pnpm run build

      - name: Extract versions
        if: inputs.solana_version == '' || inputs.anchor_version == ''
        uses: solana-developers/github-actions/extract-versions@v0.2.5
        id: versions

      - name: Setup toolchain
        uses: solana-developers/github-actions/setup-all@v0.2.5
        with:
          solana_version: ${{ inputs.solana_version || steps.versions.outputs.solana_version }}
          anchor_version: ${{ inputs.anchor_version || steps.versions.outputs.anchor_version }}
          node_version: 22

      - name: Cache node_modules
        uses: actions/cache@v3
        with:
          path: ./node_modules/
          key: node-modules-${{ runner.os }}-build-v0.1-${{ inputs.anchor_version || steps.versions.outputs.anchor_version }}-${{ inputs.solana_version || steps.versions.outputs.solana_version }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-directories: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
            test-ledger/
          shared-key: "anchor-test-${{ inputs.anchor_version || steps.versions.outputs.anchor_version }}-${{ inputs.solana_version || steps.versions.outputs.solana_version }}"

      - name: Run Anchor Tests
        shell: bash
        env:
          CARGO_INCREMENTAL: 1
          CARGO_NET_RETRY: 10
          RUST_BACKTRACE: 1
        run: |
          echo "Running tests for program: tributary"
                  FEATURES="${{ inputs.features }}"
          if [ ! -z "$FEATURES" ]; then
            FEATURES="--features $FEATURES"
          fi

          anchor test -- $FEATURES

      - name: Check Test Results
        if: ${{ failure() }}
        shell: bash
        run: |
          echo "Tests failed! Check the logs above for details."
          exit 1
