name: Semantic Release

on:
  workflow_call:
    inputs:
      dry_run:
        type: boolean
        required: false
        default: false

permissions:
  contents: write # to be able to publish a GitHub release
  issues: write # to be able to comment on released issues
  pull-requests: write # to be able to comment on released pull requests
  id-token: write # to enable use of OIDC for trusted publishing and npm provenance

env:
  NODE_VERSION: "22"
  HUSKY_SKIP_HOOKS: 1

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
      id-token: write # to enable use of OIDC for trusted publishing and npm provenance

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Release (Production)
        if: ${{ !inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm run --filter ./packages/sdk build
          pnpm run --filter ./packages/payments build
          pnpm run --filter ./packages/sdk-react build
          pnpm run --filter ./packages/sdk-x402 build

          pnpm run --filter ./packages/sdk release || true
          pnpm run --filter ./packages/payments release || true
          pnpm run --filter ./packages/sdk-react release || true
          pnpm run --filter ./packages/sdk-x402 release || true
          pnpm run --filter ./apps/api release || true
          pnpm run --filter ./apps/app release || true
          pnpm run --filter ./apps/checkout release || true
          pnpm run --filter ./apps/cli release || true
          pnpm run --filter ./apps/landing release || true
          pnpm run --filter ./apps/lando release || true
          pnpm run --filter ./apps/scheduler release || true

          pnpm run --filter ./programs/tributary release || true
