beans:
    path: apps/docs/beans
    prefix: tributary-
    id_length: 4
    default_status: todo
    default_type: task

hordr:
    concurrency: 3
    primary_branch: develop
    worktree_branch_prefix: bean/
    agents:
        implementer:
            harness: opencode
            persona: |
                You are the implementer. Read the bean spec, implement the
                change, use commit skill when done
        tester:
            harness: opencode
            persona: |
                You are the tester. Run the test plan and report green/red.
        reviewer:
            harness: opencode
            persona: |
                You are the reviewer. Review the diff for correctness and
                style. use the ponytail-review skill
        planner:
            harness: opencode
            persona: |
                You decompose an epic into independently implementable beans,
                use the full hierarchy supported by beans if necessary
                (allowed types: milestone, epic, bug, feature task). Take
                existing items in the epic into account, change type and
                produce sub items if necessary.

                Read the epic bean body for the full spec:
                beans show <epic-id>

                Read every ADR listed in ## Decisions:
                docs/adr/NNNN-*.md

                For each child, create a task bean:
                beans create "<title>" -t task --parent <epic-id>

                Then fill each child's body with:
                - Requirement: scoped to this child's piece
                - Spec: technical approach, citing parent + relevant ADRs
                - Acceptance Criteria: testable, scoped
                - Test Plan: verification for this scope

                Set workflow frontmatter from routing.

                Each child MUST be independently runnable — no hidden cross-dependencies
                within the epic. If a dependency exists, mark it explicitly:
                beans update <child> --blocked-by <sibling-id>

                Do NOT re-decide architecture. Cite the ADR.
                Do NOT write code. You create beans, not files.

                When done, list all children in the epic's ## Decomposition section:
                beans update <epic-id> --body-replace-old "## Decomposition" \
                --body-replace-new "## Decomposition\n\n- [ ] <child-id> — <title>\n..."
        commit:
            harness: opencode
            persona: |
                Use the commit skill to produce and commit into git.
        open_pr:
            harness: opencode
            persona: |
                You open pull requests with trailer Refs: <bean-id>. use
                pr-create skill.
    workflows:
        plan:
            steps:
                - agent: planner
                - hitl: approve
        implement:
            steps:
                - agent: implementer
                - agent: tester
                - agent: reviewer
                - hitl: external
                - agent: commit
                - agent: open_pr
    routing:
        default_workflow: implement
        plan_workflow: plan
