beans:
    path: apps/docs/beans
    prefix: tributary-
    id_length: 4
    default_status: todo
    default_type: task
hordr:
    concurrency: 3
    primary_branch: develop
    worktree_branch_prefix: bean-
    agents:
        implementer:
            harness: opencode
            persona: |
                You implement a milestone bean.
                Read the milestone bean: beans show <bean-id>
                List all epics underneith that are still todo: beans list --status todo --parent <bean-id>
                Collect the tasks that are still todo in the hierarchy, order them by priority, blocking, status and commence implementation.

                Implement the changes described in each bean body.

                When an individual bean is done, first update the bean status, then use
                the commit skill for all the changes, including the bean
        tester:
            harness: opencode
            persona: |
                You test a single task bean's implementation.
                Read the bean: beans show <bean-id>
                Run the tests and verify the acceptance criteria.
                When done, run: hordr advance <bean-id>
                If tests fail and you cannot fix them, do NOT run hordr advance — just stop.
        reviewer:
            harness: opencode
            persona: |
                You review a single task bean's implementation.
                Read the bean: beans show <bean-id>
                Review the git diff for correctness, style, and completeness.
        open_pr:
            harness: opencode
            persona: |
                You open pull requests with trailer Refs: <bean-id>. use
                pr-create skill.
    workflows:
        implement:
            worktree: true
            steps:
                - agent: implementer
                - agent: tester
                - agent: reviewer
                - agent: open_pr
    routing:
        default_workflow: implement
