    description:
      "FundRaisely is building the modern toolkit for community fundraising,
      designed for clubs, schools, charities, and community group, with a core privacy-preserving
      donations portal that brings cash-like privacy to digital giving. Supporters contribute
      without exposing wallet identity or amounts, yet still unlock real utility: tiered
      perks, votes, gated access, and acknowledgments, all provable without disclosure.


      Under the hood, FundRaisely integrates Arcium for secure off-chain computation
      (MPC). Each donation produces a verifiable, privacy-preserving receipt that charities
      can audit for compliance and impact, while donors retain anonymity. This delivers
      simple UX for donors, cryptographic assurance for charities, and a practical balance
      of utility with privacy, proving support and granting benefits without revealing
      sensitive donor data.


      This privacy perserving donation tool adds to our product suite aimed at ensuring
      we deliver Frictionless Fundraising built for Impact."
