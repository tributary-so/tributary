  - additionalInfo:
      "You can fully test our demo here on Devnet: https://cypherpunk-tipjar-web-production.up.railway.app/\n\
      Arcium is on testnet and we can roll out to mainnet with Acriums roll out and\
      \ embed it on our exisiting site. https://fundraisely.ie/\n\nWe took some time\
      \ out from our regular build to focus on this hackathon, however we discovered\
      \ there is a need for this and we plan to use it moving forward.  What we achieve\
      \ with Arcium in such as short time is amazing, however we opted out of full zk\
      \ or realay, due to complance and the fact we are working with club, community\
      \ groups and chairitys.  This can be added later when we have full KYC in place.\n\
      \nBeyond this prototype, FundRaisely powers real-world fundraising through interactive\
      \ quiz nights, prize management, and impact reporting. We\u2019re launching the\
      \ FundRaisely's We3 Impact Campaign in November 2025, with dozens of Web3 communities\
      \ already committed to hosting quiz fundraisers that channel funds to real causes.\
      \  We have partnered with The Giving Block and Glo Dollar for this.   FundRaisely\
      \ brings together privacy, transparency, and community to make fundraising safer,\
      \ fairer, and more effective.  https://fundraisely.ie/web3/impact-campaign/\n\n\
      The Impact Campaign is a multichain campaign with the aim of uniting web3 for\
      \ the greater good, however our long term goal of verifiable impact statements\
      \ and transparency reports wiill have their core contract on Solana.\n\nYou can\
      \ see our full features list on our founding partners offer under whats comming\
      \ next . We are going live in Nov 25 and we will be slowly bring club, charities\
      \ and community groups to Solana, starting with our Web2 offerings, and showing\
      \ them the benefits of Crypto and Web3 from campaigns like our Impact Campaign\
      \ and Subscription Donations via our new privacy preserving donations we have\
      \ built for this hackathon.  https://fundraisely.ie/founding-partners\n\nOur founder\
      \ Paula has experience in creating viral products having grow an online education\
      \ business to over 250K global students. Involved in web3 since 2016, Paula is\
      \ well respected in the Irish web3 circle and is a proud and active member of\
      \ Superteam Ireland and was selected to present FundRaisely at Irelands Hottest\
      \ Startups Dinner.  https://www.linkedin.com/in/paulaguilfoyle/\n\nPaula and Simon\
      \ have been hosting weekly educational web3 meetups together since 2020 and have\
      \ sucessfully grown A Block of Crypto to over 12000 members across the globe.\
      \ https://www.ablockofcrypto.com/.  This is being passed on to community members\
      \ as Paula and Simon focus on FundRaisely.\n\nJoin us an we bridge web3, web2,\
      \ donations and philantrophy.  This is the start of our Journey, we go live next\
      \ month and have bootstrapped the journey with some hackathon winnings along the\
      \ way.\n\nSupported by Superteam Ireland"
