      \ only keeps the rational-form AMM\u2014the Resistant AMM model\u2014which is\
      \ our first version. The second version is the one incorporating a bit of the\
      \ Landau formulation; that AMM shows up in the third and fourth conversation threads.\
      \ So what we\u2019ve shared here is just version one. Items 3 and 4 are where\
      \ the formula evolves further. Our MVP is built on that first version: it tells\
      \ the full story, but the implementation trims anything unnecessary. Version one\
      \ already delivers a lot because its math is comparatively simple.\n"
