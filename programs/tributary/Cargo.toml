[package]
name = "tributary"
version = "2.0.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "tributary"

[features]
default = []
cpi = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
mainnet = []

[dependencies]
anchor-lang = "0.31.1"
anchor-spl = "0.31.1"
bytemuck = { version = "1.14", features = ["derive"] }

# https://solana.stackexchange.com/a/21694
proc-macro2 = "1.0"
syn = "1.0"
quote = "1.0"

solana-security-txt = "1.1.1"
arrayref = "0.3.9"

# Verification: #[qed(verified)] drift-gate attributes. The proc macro
# hashes the spec handler block + the fn body at compile time — any drift
# without re-running qedgen adapt → compile_error!.
qedgen-macros = { git = "https://github.com/qedgen/solana-skills", tag = "v2.38.0" }

[dev-dependencies]
chrono = "0.4"
proptest = "1"
# Layer-2 behavior/sequence fuzzing (bean tributary-ya7m). In-process SVM —
# loads the compiled tributary.so, hand-crafted account fixtures (incl. a
# TokenAccount with delegate pre-set, bypassing the approve CPI), conservation
# + authority-inversion oracles. Run: cargo test --test mollusk_oracle
mollusk-svm = "0.14"
# Registers the SPL Token + Token-2022 program processors so the harness's
# transfer_checked CPI (delegate pull) executes against the real token logic.
mollusk-svm-programs-token = "0.14"
mollusk-svm-programs-token-2022 = "0.14"
# mollusk core is built against these newer solana crate lines (4.x / 3.x);
# we add them so the harness uses the SAME types mollusk's API expects,
# bridging to anchor's 2.x Pubkey only at account-struct field sites.
solana-account = "4"
solana-instruction = "3"
solana-pubkey = "4"
solana-rent = "4"
