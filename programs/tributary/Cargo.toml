[package]
name = "tributary"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "tributary"

[features]
default = []
cpi = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
mainnet = []

[dependencies]
anchor-lang = "0.31.1"
anchor-spl = "0.31.1"
bytemuck = { version = "1.14", features = ["derive"] }

# https://solana.stackexchange.com/a/21694
proc-macro2 = "1.0"
syn = "1.0"
quote = "1.0"

solana-security-txt = "1.1.1"
arrayref = "0.3.9"

# Verification: #[qed(verified)] drift-gate attributes. The proc macro
# hashes the spec handler block + the fn body at compile time — any drift
# without re-running qedgen adapt → compile_error!.
qedgen-macros = { git = "https://github.com/qedgen/solana-skills", tag = "v2.38.0" }

[dev-dependencies]
chrono = "0.4"
proptest = "1"
