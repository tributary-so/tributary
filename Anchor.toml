[toolchain]
package_manager = "pnpm"
anchor_version = "0.31.1"
solana_version = "2.2.11"

[features]
resolution = true
skip-lint = false

[programs.devnet]
tributary = "TRibg8W8zmPHQqWtyAD1rEBRXEdyU13Mu6qX1Sg42tJ"

[programs.mainnet]
tributary = "TRibg8W8zmPHQqWtyAD1rEBRXEdyU13Mu6qX1Sg42tJ"

[programs.localnet]
tributary = "TRibg8W8zmPHQqWtyAD1rEBRXEdyU13Mu6qX1Sg42tJ"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
# `anchor test` no longer runs the suite. Anchor still builds + deploys the
# program before invoking this script, so just print a pointer and fail fast.
# The real entry point is `anchor run surfpool` against a running Surfpool.
test = "printf '%s\\n' '⨯ anchor test no longer runs the test suite.' '' '  Integration, composable, and topup tests require a running Surfpool' '  mainnet-fork (the program is deployed on mainnet, so forked config + token' '  state must be seeded via Surfpool cheatcodes).' '' '  1. Start Surfpool:' '       surfpool start --legacy-anchor-compatibility' '  2. Run the whole suite (Rust + every jest suite):' '       anchor run surfpool' '' '  Rust unit tests only: cargo test' && exit 1"

# Single entry point for the entire suite against a running Surfpool instance.
# Chains Rust unit tests then every jest integration suite; the first failure
# aborts. Requires a FRESHLY STARTED Surfpool instance — `surfnet_resetNetwork`
# is not a full reset, so restart Surfpool between full-suite runs to avoid
# accumulated state stalling getProgramAccounts-based SDK calls:
#   surfpool start --legacy-anchor-compatibility --no-tui
# (Surfpool auto-deploys the program from target/deploy on start.)
#  export ANCHOR_PROVIDER_URL=http://localhost:8899 ANCHOR_WALLET=/home/xeroc/.config/solana/id.json
surfpool = "anchor run test-cargo && anchor run test-integration"
test-cargo = "cargo test"
test-integration = "npx jest ./tests/*.ts"

[test]
startup_wait = 20000

# This deploys the program using --upgradeable-program, and the initial upgrade authority will be set to provider.wallet
upgradeable = true
