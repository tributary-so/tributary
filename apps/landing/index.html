    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What is Tributary?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Tributary is the rule-based money-moving primitive on Solana. A user delegates spending authority once, and money then moves itself within rules they set — a trigger (WHEN), a value to pull (PULL), a destination to route to (ROUTE). Its live configuration is what the market calls recurring payments — subscriptions, milestones, pay-as-you-go, one-time — and the same primitive composes into conditional, auto-routed flows. Non-custodial; live on Solana mainnet with 400ms finality and sub-cent fees."
            }
          },
          {
            "@type": "Question",
            "name": "How does token delegation work?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Users sign a single transaction to delegate tokens to Tributary's on-chain program. The protocol executes payments automatically on schedule without locking funds in escrow. Users retain full custody — funds stay in their wallet until a payment is due. Delegation can be revoked anytime."
            }
          },
          {
            "@type": "Question",
            "name": "How do I accept USDC without Solana code?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Use Tributary's hosted checkout page at checkout.tributary.so. Your user signs once through the checkout, then lands back on your site with a JWT. You verify the JWT with any standard library — no Solana SDK, no RPC provider, no keypairs needed. One React hook is all it takes."
            }
          },
          {
            "@type": "Question",
            "name": "Is Tributary secure?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Tributary is fully non-custodial — $0 TVL risk. Funds remain in user wallets. The protocol only holds delegated authority for specific amounts and schedules. Open-source, verifiable on-chain, and revocable anytime. Full CI/CD pipeline with comprehensive testing."
            }
          },
          {
            "@type": "Question",
            "name": "Can users cancel subscriptions?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Absolutely. Users have full control and can pause, resume, or cancel any payment policy anytime through their wallet or dApp. No lock-in, no penalty."
            }
          },
          {
            "@type": "Question",
            "name": "What is x402 integration?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Tributary powers x402 (HTTP 402 Payment Required) for web micropayments. This enables seamless payment flows over HTTP without breaking the request-response cycle — ideal for API monetization, AI agent billing, and pay-per-use services."
            }
          },
          {
            "@type": "Question",
            "name": "What is a pull payment?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "A pull payment is a money transfer initiated by the recipient under spending authority the payer delegated in advance — the opposite of a push payment, where the sender signs every transaction. On Solana, Tributary implements pull payments via SPL token delegation: the recipient's program debits the payer's token account up to agreed limits without ever taking custody of the funds."
            }
          },
          {
            "@type": "Question",
            "name": "How do non-custodial subscriptions work?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Non-custodial subscriptions work by delegating spending authority instead of locking funds: the subscriber signs one transaction granting Tributary permission to pull a set amount on a schedule, and the funds stay in the subscriber's wallet until each charge is due. The protocol never holds the funds, so there is zero TVL risk and the subscriber can revoke at any time."
            }
          },
          {
            "@type": "Question",
            "name": "Tributary vs Helio — what is the difference?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Helio is a custodial payment processor on Solana that holds funds in its own wallets, while Tributary is a non-custodial pull-payment protocol where funds never leave the user's wallet until a payment is pulled. Choose Helio for hosted, processor-style checkout; choose Tributary when custody risk, composability, or open-source verifiability matter."
            }
          },
          {
            "@type": "Question",
            "name": "Can AI agents pay for their own API calls?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes — AI agents can pay for their own API calls using x402, the HTTP 402 Payment Required status code repurposed as a native pay-per-request protocol. Tributary provides x402 middleware that lets an agent hold a delegated token balance and settle each request against it, enabling autonomous agent billing without per-call human approval."
            }
          },
          {
            "@type": "Question",
            "name": "What blockchains does Tributary support?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Tributary runs on Solana mainnet, using SPL token delegation and the network's 400ms finality and sub-cent fees. It supports any SPL token — including USDC, USDT, and SOL (wrapped) — for subscriptions, milestones, and pay-as-you-go billing."
            }
          },
          {
            "@type": "Question",

              "text": "Tributary is free to integrate — no monthly fees and no setup costs. The protocol takes 20% of an optional gateway fee (~1% at typical rates), charged only when payments are processed through the hosted gateway."
            }
          }
