site_name: Tributary Protocol Documentation
site_description: Open-source, permissionless automated payment infrastructure for Solana
site_url: https://docs.tributary.so
repo_url: https://github.com/tributary-so/tributary
repo_name: tributary-so/tributary

theme:
  name: material
  custom_dir: docs/overrides
  font:
    text: Roboto Mono
    code: Roboto Mono

  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: white
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - scheme: slate
      primary: black
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Use Cases: use-cases.md
  - FAQ: faq.md
  - Developer Guide:
      - Basics: how.md
      - Integration Options: integration.md
      - SDKs:
          - Tributary SDK: sdk.md
          - React SDK:
              - Installation: sdk-react/index.md
              - Quick Buttons: sdk-react/buttons.md
              - Hooks: sdk-react/hooks.md
              - Common Patterns: sdk-react/common.md
          - x402 Payments:
              - Overview: x402.md
              - Getting Started: x402-getting-started.md
              - API Reference: x402-api-reference.md
      - CLI Tools: tools.md
      - Payments:
          - Checkout Page Links: checkout.md
          - Payment Token: jwt-auth.md
      - API Server:
          - Overview: api/overview.md
          - REST API: api/rest-api.md
          - WebSocket API: api/websocket.md
          - Examples: api/examples.md
      - Protocol:
          - Overview: architecture.md
          - Contract: smart-contract.md
          - Providers: providers.md
          - Fees: fees.md
          - Referral Program: referral-program.md
          - Security: security.md
          - Policy Types:
              - Subscription Payments: policies/subscription.md
              - Milestone Payments: policies/milestone.md
              - Pay-as-you-go Payments: policies/payasyougo.md

plugins:
  - social:
  - search:
  - privacy:
  - llmstxt:
      full_output: llms-full.txt
      sections:
        Usage documentation:
          - index.md: Main documentation page
          - "*.md"

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji ""
      emoji_generator: !!python/name:material.extensions.emoji.to_svg ""
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format ""
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/tributary-so/tributary
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/tributaryso

extra_css:
  - stylesheets/extra.css
